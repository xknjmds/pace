<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Progress Always Comes Eventually. A calm routine and deadline companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PACE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PACE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C2622" media="(prefers-color-scheme: dark)">
  <style>
    /* Loading screen: the cairn builds itself while Flutter starts, then
       fades out on the first frame. Brand colours from GUIDELINES.md. */
    :root { --bg: #F3EEE6; --mark: #35665A; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1C2622; --mark: #9CC3B4; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #pace-splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: var(--bg); transition: opacity 240ms ease-out; z-index: 9;
    }
    #pace-splash.gone { opacity: 0; pointer-events: none; }
    #pace-splash svg { width: 88px; height: 88px; }
    #pace-splash rect {
      fill: var(--mark); opacity: 0; transform: translateY(-10px);
      animation: pace-stone 420ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    #pace-splash rect:nth-child(1) { animation-delay: 80ms; }
    #pace-splash rect:nth-child(2) { animation-delay: 220ms; }
    #pace-splash rect:nth-child(3) { animation-delay: 360ms; }
    @keyframes pace-stone { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #pace-splash rect { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="pace-splash" aria-label="PACE is loading" role="img">
    <!-- Bottom stone first, so the cairn is built upward. -->
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <rect x="40" y="159" width="176" height="56" rx="28"/>
      <rect x="66" y="97" width="124" height="50" rx="25"/>
      <rect x="92" y="41" width="72" height="44" rx="22"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('pace-splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
