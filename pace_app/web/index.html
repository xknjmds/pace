<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Progress Always Comes Eventually. A calm routine and deadline companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PACE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PACE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C2622" media="(prefers-color-scheme: dark)">
  <style>
    /* Loading screen: Tuck settles in and breathes while Flutter starts, then
       fades out on the first frame. Brand colours from GUIDELINES.md. */
    :root { --bg: #F3EEE6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1C2622; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #pace-splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: var(--bg); transition: opacity 240ms ease-out; z-index: 9;
    }
    #pace-splash.gone { opacity: 0; pointer-events: none; }
    #pace-splash img {
      width: 132px; height: auto; transform-origin: 50% 100%;
      opacity: 0; transform: translateY(6px);
      animation: tuck-in 420ms cubic-bezier(0.23, 1, 0.32, 1) 60ms forwards,
                 tuck-breathe 3.6s ease-in-out 480ms infinite;
    }
    @keyframes tuck-in { to { opacity: 1; transform: none; } }
    @keyframes tuck-breathe {
      0%, 100% { opacity: 1; transform: none; }
      50% { opacity: 1; transform: scale(0.995, 1.018); }
    }
    @media (prefers-reduced-motion: reduce) {
      #pace-splash img { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="pace-splash" aria-label="PACE is loading" role="img">
    <!-- Tuck settles in, then breathes slowly until the app is ready. -->
    <img src="icons/tuck-splash.png" alt="" width="132" height="132">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('pace-splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
