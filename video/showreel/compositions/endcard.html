  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      gsap.set("#ec-tag", { xPercent: -50 });
      const paths = document.querySelectorAll("#ec-word .ec-p");
      paths.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L + " " + L; p.dataset.len = L; });

      // Home again: the ground floods back to Sand.
      tl.fromTo("#ec-sand", { clipPath: "circle(0px at 960px 540px)" }, { clipPath: "circle(1150px at 960px 540px)", duration: 0.4, ease: "power2.in" }, 0);

        tl.to(id, { y: -12, duration: 0.07, ease: "power2.out" }, land);

      // Tuck rises up under the cairn.

      paths.forEach((p, i) => {
